tag:
  - math_word_problems
task: gsm_plus_mini_instruction
dataset_path: qintongli/GSM-Plus
output_type: generate_until
training_split: testmini
fewshot_split: testmini
test_split: testmini
doc_to_text: |
  Solve the following math problem step by step.

      IMPORTANT OUTPUT FORMAT:
      - Your final line must be exactly: The answer is <NUMBER>
      - Output ONLY the number on the final line (no '$', no commas, no units, no extra words).
      - Put the final line on its own line.
      
      Problem:
  {{question}}
doc_to_target: "{{solution}}"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: false
    regexes_to_ignore:
      - ","
      - "\\$"
      - "(?s).*#### "
      - "\\.$"
generation_kwargs:
  until:
    - "Question:"
    - "</s>"
    - "<|im_end|>"
  do_sample: false
  temperature: 0.0
repeats: 1
num_fewshot: 5
filter_list:
  - name: "strict-match"
    filter:
      - function: "regex"
        regex_pattern: "#### (\\-?[0-9\\.\\,]+)"
      - function: "take_first"
  - name: "flexible-extract"
    filter:
      - function: "regex"
        group_select: -1
        regex_pattern: "(-?[$0-9.,]{2,})|(-?[0-9]+)"
      - function: "take_first"
metadata:
  version: 1.0
